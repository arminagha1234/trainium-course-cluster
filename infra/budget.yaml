AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Trainium Course Cluster - Budget and kill-switch. Deployed AFTER
  parent-stack.yaml. Imports the parent's SNS alerts topic. The 90 percent
  threshold invokes a Lambda that stops class-tagged EC2 EXCEPT instances
  tagged AutoStop=false, as a last-resort spending backstop (design divergence
  D13; Requirements 20.3/20.4/20.5). Because the ParallelCluster head + compute
  fleet is tagged AutoStop=false, this spares the prepaid MLCB compute and any
  active student session while still stopping runaway non-cluster resources that
  carry the class tag. The MLCB itself is prepaid so this primarily guards
  against unexpected EBS / NAT / EC2 spend outside the reservation.

Parameters:
  ClusterName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,39}$'
    Description: Must match the ClusterName used for parent-stack.yaml.

  ClassTag:
    Type: String
    Default: nki-2026-fall
    Description: Same ClassTag as the parent stack.

  MonthlyBudgetUsd:
    Type: Number
    Default: 500
    MinValue: 50
    Description: Monthly USD budget cap for resources tagged Class=<ClassTag>.

  AlertEmail:
    Type: String
    Description: Email subscribed to the alerts SNS topic. Must be confirmed after deploy.

  LambdaCodeBucket:
    Type: String
    Description: >
      S3 bucket holding the packaged kill_switch Lambda zip (the per-cluster
      bootstrap bucket, same as the manifest / auto_teardown lambdas). Populated
      by scripts/deploy.sh.

  LambdaCodeKey:
    Type: String
    Description: S3 key of the packaged kill_switch Lambda zip (e.g. lambda/kill_switch.zip).

Resources:
  # Subscribe the given email to the parent stack's alerts topic.
  AlertsEmailSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !ImportValue
        Fn::Sub: ${ClusterName}-alerts-topic-arn
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Separate kill-switch topic - budget notifications point here at 90%.
  KillSwitchTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ClusterName}-kill-switch
      DisplayName: !Sub ${ClusterName} kill switch

  KillSwitchTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref KillSwitchTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref KillSwitchTopic

  KillSwitchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StopClassInstances
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Class: !Ref ClassTag

  KillSwitchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ClusterName}-kill-switch
      Runtime: python3.12
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt KillSwitchLambdaRole.Arn
      Handler: handler.lambda_handler
      # Loaded from S3 (mirrors infra/auto-teardown.yaml) rather than inlined, so
      # the stop logic lives in lambda/kill_switch/handler.py and is unit-testable.
      # scripts/deploy.sh zips lambda/kill_switch/ to the bootstrap bucket and
      # passes LambdaCodeBucket / LambdaCodeKey.
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          CLASS_TAG: !Ref ClassTag
          # boto3 default region resolution can miss in some invocation
          # contexts; pass the region explicitly (mirrors the other lambdas).
          AWS_TARGET_REGION: !Ref AWS::Region

  KillSwitchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ClusterName}-kill-switch
      RetentionInDays: 90

  KillSwitchSnsSub:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref KillSwitchTopic
      Protocol: lambda
      Endpoint: !GetAtt KillSwitchLambda.Arn

  KillSwitchLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref KillSwitchLambda
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref KillSwitchTopic

  ClassBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ClusterName}-budget
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          TagKeyValue:
            - !Sub 'user:Class$${ClassTag}'
      # AWS Budgets permits only ONE notification per unique
      # (NotificationType, ComparisonOperator, Threshold, ThresholdType) tuple,
      # and at most ONE SNS subscriber per notification (EMAIL subscribers may
      # be many). The imported alerts SNS topic (${ClusterName}-alerts-topic-arn)
      # has NO policy allowing budgets.amazonaws.com to publish, so TA alerts go
      # out as EMAIL subscribers instead - Budgets emails them directly, which
      # needs no SNS topic policy. The 90% threshold additionally triggers the
      # kill-switch Lambda via the KillSwitchTopic SNS (which DOES carry the
      # required budgets-publish TopicPolicy). At 90% the single notification
      # carries BOTH the SNS (KillSwitchTopic) and an EMAIL (TA) subscriber,
      # which is allowed.
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 90
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref KillSwitchTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  KillSwitchTopicArn:
    Value: !Ref KillSwitchTopic
  KillSwitchLambdaName:
    Value: !Ref KillSwitchLambda
  BudgetName:
    Value: !Sub ${ClusterName}-budget
  Notes:
    Value: !Sub |
      Post-deploy actions:
      1. Confirm the email subscription sent to ${AlertEmail}.
      2. In Billing > Cost Allocation Tags, activate the "Class" tag. Takes
         ~24h to propagate before the budget's tag filter matches spend.
