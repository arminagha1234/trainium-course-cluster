AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Trainium Course Cluster - Automated end-of-block teardown (design divergence
  D1). Deployed AFTER the parent, ParallelCluster, and budget stacks. Creates a
  one-time EventBridge Scheduler schedule that fires at the MLCB EndDateTime and
  invokes a Python 3.12 Lambda. The Lambda deletes the ParallelCluster stack and
  the budget stack via the CloudFormation API, and deliberately leaves the
  parent stack and the EFS filesystem intact so student work survives whether
  the teardown succeeds or fails. It imports the parent stack's alerts SNS topic
  and publishes start / success / failure notifications there.

Parameters:
  ClusterName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,39}$'
    Description: Must match the ClusterName used for parent-stack.yaml.

  ClassTag:
    Type: String
    Default: nki-2026-fall
    Description: Same ClassTag as the parent stack. Applied to created resources and used in alert text.

  MlcbEndTimeUtc:
    Type: String
    AllowedPattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
    Description: >
      MLCB reservation EndDateTime in UTC, formatted YYYY-MM-DDTHH:MM:SS (no
      timezone suffix, no fractional seconds). scripts/deploy.sh (task 2.2)
      derives this from `aws ec2 describe-capacity-reservations`. The one-time
      schedule fires at this instant to tear the cluster down.

  PClusterStackName:
    Type: String
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{0,127}$'
    Description: >
      ParallelCluster CloudFormation stack name to delete. ParallelCluster
      names its root stack the same as the cluster, so this is normally the
      ClusterName. Deleted by the teardown Lambda.

  BudgetStackName:
    Type: String
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{0,127}$'
    Description: >
      Budget stack name to delete (conventionally <ClusterName>-budget).
      Deleted by the teardown Lambda.

  ParentStackName:
    Type: String
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{0,127}$'
    Description: >
      Parent stack name (conventionally <ClusterName>-parent). NEVER deleted -
      passed only so the Lambda can defensively refuse to touch the stack that
      owns the VPC, EFS filesystem, and student manifest.

  LambdaCodeBucket:
    Type: String
    Description: >
      S3 bucket holding the packaged auto_teardown Lambda zip (the per-cluster
      bootstrap bucket, same as the manifest Lambda). Populated by deploy.sh.

  LambdaCodeKey:
    Type: String
    Description: S3 key of the packaged auto_teardown Lambda zip (e.g. lambda/auto_teardown.zip).

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ ENABLED, DISABLED ]
    Description: Whether the one-time teardown schedule is armed. Set DISABLED to stage without arming.

Resources:
  # ==========================================================================
  # Teardown Lambda role - least privilege.
  #   * DeleteStack/DescribeStacks scoped to ONLY the pcluster + budget stacks
  #     (the parent stack ARN is intentionally excluded so the VPC/EFS/manifest
  #     cannot be deleted - Requirement 22.2).
  #   * SNS Publish scoped to the imported alerts topic only.
  # NOTE: CloudFormation itself performs the underlying resource deletions when
  # a stack is deleted; the ParallelCluster stack manages teardown of its own
  # compute/IAM resources. If a future ParallelCluster version requires the
  # caller to hold resource-level delete permissions, widen this policy
  # deliberately rather than by default.
  # ==========================================================================
  TeardownLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeleteClassStacksAndAlert
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeleteAndInspectPclusterAndBudgetStacks
                Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${PClusterStackName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${BudgetStackName}/*'
              - Sid: PublishTeardownAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !ImportValue
                  Fn::Sub: ${ClusterName}-alerts-topic-arn
      Tags:
        - Key: Class
          Value: !Ref ClassTag

  TeardownLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ClusterName}-auto-teardown
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt TeardownLambdaRole.Arn
      Timeout: 900        # 15 min - max the Lambda can wait for a stack delete.
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          CLUSTER_NAME: !Ref ClusterName
          CLASS_TAG: !Ref ClassTag
          PCLUSTER_STACK_NAME: !Ref PClusterStackName
          BUDGET_STACK_NAME: !Ref BudgetStackName
          PARENT_STACK_NAME: !Ref ParentStackName
          ALERTS_TOPIC_ARN: !ImportValue
            Fn::Sub: ${ClusterName}-alerts-topic-arn
          # boto3 default region resolution can miss in some invocation
          # contexts; pass the region explicitly (mirrors the manifest Lambda).
          AWS_TARGET_REGION: !Ref AWS::Region
      Tags:
        - Key: Class
          Value: !Ref ClassTag

  TeardownLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ClusterName}-auto-teardown
      RetentionInDays: 90

  # ==========================================================================
  # EventBridge Scheduler execution role. EventBridge Scheduler invokes the
  # Lambda via this role (no AWS::Lambda::Permission is needed for Scheduler
  # targets). Scoped to invoking the single teardown function, with a
  # SourceAccount confused-deputy guard on the trust policy.
  # ==========================================================================
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeTeardownLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TeardownLambda.Arn
      Tags:
        - Key: Class
          Value: !Ref ClassTag

  # One-time schedule: fires once at the MLCB end time (UTC) and invokes the
  # teardown Lambda. FlexibleTimeWindow OFF => fire at the exact instant.
  TeardownSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ClusterName}-auto-teardown
      Description: !Sub One-time end-of-block teardown for ${ClusterName} at the MLCB end time.
      State: !Ref ScheduleState
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Sub 'at(${MlcbEndTimeUtc})'
      ScheduleExpressionTimezone: UTC
      Target:
        Arn: !GetAtt TeardownLambda.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn

Outputs:
  TeardownLambdaName:
    Value: !Ref TeardownLambda
  TeardownLambdaArn:
    Value: !GetAtt TeardownLambda.Arn
  TeardownScheduleName:
    Value: !Sub ${ClusterName}-auto-teardown
  TeardownScheduleArn:
    Value: !GetAtt TeardownSchedule.Arn
  Notes:
    Value: !Sub |
      Auto-teardown armed for ${ClusterName}.
      - Fires once at ${MlcbEndTimeUtc} UTC (schedule state: ${ScheduleState}).
      - Deletes stacks: ${PClusterStackName} and ${BudgetStackName}.
      - Retains the parent stack (${ParentStackName}) and the EFS filesystem
        so student work is preserved whether teardown succeeds or fails.
      - Publishes start / success / failure notifications to the imported
        ${ClusterName}-alerts-topic-arn SNS topic.
