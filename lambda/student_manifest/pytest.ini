[pytest]
# Minimal config so the Manifest Lambda suite runs with `python -m pytest`
# from this directory (or via `python -m pytest lambda/student_manifest`).
#
# test_handler.py inserts its own directory onto sys.path and re-imports
# handler.py under moto (handler reads its config from env vars at import
# time), so no extra path/import-mode config is required here.
testpaths = .
python_files = test_*.py
addopts = -ra

# Pre-registered so the hypothesis property tests added in tasks 10.2-10.7 can
# mark themselves without triggering PytestUnknownMarkWarning.
markers =
    property: property-based test (hypothesis) validating a design Property (P1-P7)
